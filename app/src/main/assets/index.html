<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
    <h1>Проба пера</h1>
    <p>Неужели работает 🤔</p>
    <input id="checkNew" type="button" value="Обновить">
    <div id="outPut"></div>

    <script>
        document.getElementById('checkNew').addEventListener('click', function() {
            const output = document.getElementById('outPut');
            output.textContent = 'Загрузка...';

            fetch('https://komekcom.kz')
                .then(response => response.text())
                .then(html => {
                    // Выводим HTML-код страницы как текст
                    output.textContent = html;
                })
                .catch(error => {
                    output.textContent = 'Ошибка: ' + error;
                });
        });
    </script>
</body>
</html>
